services:
  postgres:
    image: postgres:16-alpine
    container_name: fashion_commerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fashion_user
      POSTGRES_PASSWORD: fashion_password
      POSTGRES_DB: fashion_commerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion_user -d fashion_commerce"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
