services:
  postgres:
    image: postgres:16-alpine
    container_name: atelier_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      POSTGRES_DB: ${POSTGRES_DB:-fashion_commerce}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER} -d ${POSTGRES_DB:-fashion_commerce}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atelier_network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: atelier_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fashion_commerce}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET to a random secret of at least 32 characters}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN to the deployed storefront origin}
      TRUST_PROXY: "true"
      META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN:-}
      META_WHATSAPP_PHONE_ID: ${META_WHATSAPP_PHONE_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - uploads_data_prod:/app/backend/uploads
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - atelier_network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: atelier_frontend_prod
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: ${FRONTEND_ORIGIN:-http://localhost:3000}
      API_BASE_URL: http://backend:4000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - atelier_network

volumes:
  postgres_data_prod:
  uploads_data_prod:

networks:
  atelier_network:
    driver: bridge
